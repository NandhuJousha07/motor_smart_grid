# Motor Smart GRID - nginx location block (adjust the path/alias to your portal)
# Serves the split build (option-B) at https://<portal>/smart-grid/

location /smart-grid/ {
    alias /var/www/smart-grid/;          # folder containing index.html, assets/, data/
    index index.html;
    charset utf-8;

    # Rates change monthly: never let browsers keep stale GRID data
    location ~* /smart-grid/data/.*\.json$ {
        alias /var/www/smart-grid/data/;
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/json;
    }
    location ~* /smart-grid/(.*\.html)$ {
        add_header Cache-Control "no-cache" always;
    }
    location ~* /smart-grid/assets/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # Security headers (option-B needs no inline script)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
}

# If you deploy option-A (single file) instead, use:
#   script-src 'self' 'unsafe-inline';
# because the page script and data are inline.
