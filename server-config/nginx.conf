# Motor Smart GRID - nginx (place inside your portal's existing  server { ... }  block)
#
# Files on the server (the kit's smart-grid/ folder):
#     /var/www/smart-grid/index.html
#     /var/www/smart-grid/assets/app.js, styles.css
#     /var/www/smart-grid/data/versions.json            <- list of GRID versions
#     /var/www/smart-grid/data/2026-10-v1.json          <- one rates file per version
#     /var/www/smart-grid/visitor-counter.php
# Address: https://<your-portal>/smart-grid/
#
# If your folder is elsewhere, change ONLY the  root  lines: root is the folder that
# CONTAINS "smart-grid" (e.g. files in /srv/portal/public/smart-grid -> root /srv/portal/public;).
# After editing:  sudo nginx -t  &&  sudo systemctl reload nginx

# /smart-grid (no trailing slash) -> /smart-grid/
location = /smart-grid {
    return 301 /smart-grid/;
}

# Page + data: always revalidate so nobody sees last month's rates
location /smart-grid/ {
    root /var/www;
    index index.html;
    charset utf-8;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;
}

# Script and stylesheet: may be cached for an hour
location /smart-grid/assets/ {
    root /var/www;
    try_files $uri =404;

    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript;
}

# the single file (single file motor-smart-grid.html, every version inside) instead of the website folder:
#   put the file at /var/www/smart-grid/index.html, keep the blocks above, and in the
#   Content-Security-Policy line change  script-src 'self'  to  script-src 'self' 'unsafe-inline'
#   (the single file carries its script and data inside the page).

# ---------------------------------------------------------------------------------------------
# Visitor counter (visitor-counter.php + counter-data/). Keep the count file private.
# Put this BEFORE your existing  location ~ \.php$ { ... }  block.
location ^~ /smart-grid/counter-data/ {
    deny all;
}
# visitor-counter.php is run by your existing PHP (php-fpm) block. If the portal has none:
#   location = /smart-grid/visitor-counter.php {
#       root /var/www;
#       include fastcgi_params;
#       fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#       fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match your PHP version
#   }
